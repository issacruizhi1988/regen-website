<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource · ReGen Performance</title>
<meta id="meta-desc" name="description" content="A short guide from ReGen Performance.">
<meta property="og:title" content="Resource · ReGen Performance">
<meta property="og:description" content="A short guide from ReGen Performance.">
<meta property="og:image" content="/assets/img/icon-512.png">
<meta property="og:type" content="article">
<meta name="theme-color" content="#070707">
<link rel="icon" type="image/png" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body data-page="resources">
<main>
  <section class="section" style="padding-bottom:0">
    <div class="wrap-narrow" id="resource-root"></div>
  </section>

  <section class="cta-band" id="cta-section" hidden>
    <div class="glow"></div>
    <div class="wrap-narrow reveal">
      <span class="eyebrow">Ready to Put This Into Practice?</span>
      <h2 class="h2" style="margin-top:1rem">Book a Free <em>Discovery Call</em></h2>
      <div class="btn-row"><a class="btn btn-gold" id="cta-wa" href="/book.html" target="_blank" rel="noopener">WhatsApp Us</a><a class="btn btn-ghost" href="/resources.html">More Resources</a></div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="/assets/js/site.js"></script>
<script>
RG.ready(async function (site) {
  var slug = RG.param("r");
  var r = await RG.load("resources");
  var res = (r.resources || []).find(function (x) { return x.slug === slug; });
  var root = document.getElementById("resource-root");

  if (!res) {
    root.innerHTML = '<div class="empty">We couldn\'t find that resource.<br><br><a class="link-arrow" href="/resources.html">Back to all resources <span>→</span></a></div>';
    return;
  }

  document.title = res.title + " · ReGen Performance";
  if (res.summary) {
    document.getElementById("meta-desc").setAttribute("content", res.summary);
    document.querySelector('meta[property="og:description"]').setAttribute("content", res.summary);
  }
  document.querySelector('meta[property="og:title"]').setAttribute("content", res.title + " · ReGen Performance");

  root.innerHTML =
    '<a class="link-arrow" href="/resources.html"><span style="transform:rotate(180deg)">→</span> All resources</a>' +
    (res.emoji ? '<div style="font-size:2.4rem;margin-top:2rem">' + RG.esc(res.emoji) + '</div>' : '') +
    '<h1 class="h2" style="margin-top:1rem">' + RG.esc(res.title) + '</h1>' +
    (res.summary ? '<p class="lead" style="margin-top:1.2rem;max-width:none">' + RG.esc(res.summary) + '</p>' : '') +
    '<div class="divider"></div>' +
    '<div class="prose">' + RG.md(res.body) + '</div>';

  document.getElementById("cta-wa").href = RG.wa(site.whatsapp, site.whatsappMessage);
  document.getElementById("cta-section").hidden = false;
});
</script>
</body>
</html>
