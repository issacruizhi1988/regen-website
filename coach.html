<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach · ReGen Performance</title>
<meta id="meta-desc" name="description" content="Meet a ReGen Performance coach.">
<meta property="og:title" content="Coach · ReGen Performance">
<meta property="og:description" content="Meet a ReGen Performance coach.">
<meta property="og:image" content="/assets/img/icon-512.png">
<meta property="og:type" content="profile">
<meta name="theme-color" content="#070707">
<link rel="icon" type="image/png" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body data-page="coaches">
<main>
  <div class="wrap" style="padding-top:2.5rem">
    <a class="link-arrow" href="/coaches.html"><span style="transform:rotate(180deg)">→</span> All coaches</a>
  </div>
  <div id="coach-root" class="wrap" style="padding:2rem 1.5rem 2rem"></div>

  <section class="cta-band" id="cta-section" hidden>
    <div class="glow"></div>
    <div class="wrap-narrow reveal">
      <div class="hero-vline"></div>
      <span class="eyebrow">Start Your Journey</span>
      <h2 class="h2" style="margin-top:1rem">Your Body Works Better<br><em>As a System</em></h2>
      <p class="lead">Take the first step towards a stronger, more resilient you. A free 30-minute discovery call, no pressure, just clarity.</p>
      <div class="btn-row"><a class="btn btn-gold" id="cta-wa" href="/book.html" target="_blank" rel="noopener">WhatsApp Us</a><a class="btn btn-ghost" href="/book.html">How It Works</a></div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="/assets/js/site.js"></script>
<script>
RG.ready(async function (site) {
  var slug = RG.param("c");
  var c = await RG.load("coaches");
  var coach = (c.coaches || []).find(function (k) { return k.slug === slug; });
  var root = document.getElementById("coach-root");

  if (!coach) {
    root.innerHTML = '<div class="empty">We couldn\'t find that coach.<br><br><a class="link-arrow" href="/coaches.html">Back to all coaches <span>→</span></a></div>';
    return;
  }

  document.title = coach.name + " · ReGen Performance";
  if (coach.bio) {
    document.getElementById("meta-desc").setAttribute("content", coach.bio);
    document.querySelector('meta[property="og:description"]').setAttribute("content", coach.bio);
  }
  document.querySelector('meta[property="og:title"]').setAttribute("content", coach.name + " · ReGen Performance");

  var firstName = (coach.name || "").split(/\s+/)[0] || "there";
  var waMsg = "Hi " + firstName + ", I found you on the ReGen Performance website and I'd like to book a free discovery call.";
  var waLink = RG.wa(coach.whatsapp || site.whatsapp, waMsg);
  var ig = RG.igUrl(coach.instagram);

  var pricingHtml = "";
  if (coach.pricing && coach.pricing.length) {
    pricingHtml = '<div class="fact"><span class="card-label">Sessions &amp; Pricing</span>' +
      '<p style="margin-bottom:0.8rem">Start with a free 30-minute discovery call.</p>' +
      coach.pricing.map(function (p) {
        return '<div class="price-row"><span>' + RG.esc(p.label) + '</span><b>' + RG.esc(p.price) + '</b></div>';
      }).join("") + '</div>';
  }

  var factsHtml =
    (coach.specialty ? '<div class="fact"><span class="card-label">Specialty</span><p>' + RG.esc(coach.specialty) + '</p></div>' : '') +
    '<div class="fact"><span class="card-label">Book</span><p style="margin-bottom:0.9rem">Start with a free 30-minute discovery call.</p><a class="btn btn-gold btn-sm" href="' + waLink + '" target="_blank" rel="noopener">WhatsApp ' + RG.esc(firstName) + '</a></div>' +
    (ig ? '<div class="fact"><span class="card-label">Instagram</span><p><a href="' + ig + '" target="_blank" rel="noopener">@' + RG.esc(coach.instagram.replace(/^@/, "")) + '</a></p></div>' : '') +
    (coach.location ? '<div class="fact"><span class="card-label">Location</span><p>' + RG.esc(coach.location) + '</p></div>' : '') +
    (coach.credentials && coach.credentials.filter(Boolean).length && !/certif|qualif/i.test(coach.about || "") ? '<div class="fact"><span class="card-label">Credentials</span><ul>' + coach.credentials.filter(Boolean).map(function (x) { return '<li>' + RG.esc(x) + '</li>'; }).join("") + '</ul></div>' : '') +
    pricingHtml;

  var videosHtml = "";
  if (coach.videos && coach.videos.filter(function (v) { return v.youtubeId; }).length) {
    videosHtml = '<div class="video-grid" style="margin-top:2.5rem">' + coach.videos.filter(function (v) { return v.youtubeId; }).map(function (v) {
      return '<div>' + RG.video(v.youtubeId, v.title) + (v.title ? '<div class="video-cap"><span class="card-title">' + RG.esc(v.title) + '</span></div>' : '') + '</div>';
    }).join("") + '</div>';
  }

  root.innerHTML =
    '<div class="profile">' +
    '<aside class="profile-aside reveal">' +
    '<div class="coach-photo">' + RG.photo(coach.photo, coach.name) + '</div>' +
    factsHtml +
    '</aside>' +
    '<div class="reveal">' +
    '<span class="eyebrow">Coach</span>' +
    '<h1 class="h2" style="margin-top:0.8rem">' + RG.esc(coach.name) + '</h1>' +
    (coach.motto ? '<div class="pq" style="text-align:left;padding-left:0;padding-right:0"><p>' + RG.esc(coach.motto) + '</p></div>' : '') +
    (coach.about ? '<div class="prose" style="margin-top:1.6rem">' + RG.md(coach.about) + '</div>' : '') +
    videosHtml +
    '</div></div>';

  RG.reveal(root);
  document.getElementById("cta-section").hidden = false;
});
</script>
</body>
</html>
