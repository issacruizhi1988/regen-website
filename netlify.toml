[build]
  publish = "."
  # Generates /coaches/<slug>/ pages (shareable links with each coach's photo preview).
  command = "python3 tools/build.py"

[[redirects]]
  from = "/book.html"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/method"
  to = "/philosophy.html"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"
